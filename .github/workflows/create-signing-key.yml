name: Create signing key (run once)

# One-time setup, designed to be done from a phone. It creates the key that signs every
# release, stores it as the KEYSTORE_BASE64 secret and offers a backup copy to download.
#
# Before running it, add two repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_PASSWORD  a password you invent (at least 16 characters); keep it somewhere safe
#   SETUP_TOKEN        a fine-grained token for this repository with "Secrets: Read and write"
#
# It refuses to run if a key already exists, because replacing the key would stop
# installed copies of the app from updating.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "create" to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ "$CONFIRM" != "create" ]; then echo "::error::Type the word create to confirm."; exit 1; fi
          if [ -n "$EXISTING" ]; then echo "::error::A signing key already exists (KEYSTORE_BASE64). Nothing was changed."; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Add the KEYSTORE_PASSWORD secret first."; exit 1; fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 16 ]; then echo "::error::KEYSTORE_PASSWORD must be at least 16 characters, because the backup file is protected only by it."; exit 1; fi
          if [ -z "$SETUP_TOKEN" ]; then echo "::error::Add the SETUP_TOKEN secret first."; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore hejje-release.keystore \
            -alias hejje -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -dname "CN=Hejje" > /dev/null 2>&1
          keytool -list -keystore hejje-release.keystore -storepass:env KEYSTORE_PASSWORD | grep -i fingerprint

      - name: Store it as the KEYSTORE_BASE64 secret
        env:
          GH_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: base64 -w 0 hejje-release.keystore | gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"

      - name: Offer the backup copy (available for 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: hejje-signing-key-backup
          path: hejje-release.keystore
          retention-days: 1
          if-no-files-found: error
