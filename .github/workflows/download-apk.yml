name: Download APK

# A manually requested development build, downloadable without opening an artifact ZIP.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Keep a copy in Actions
        uses: actions/upload-artifact@v4
        with:
          name: hejje-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp app/build/outputs/apk/debug/app-debug.apk hejje-debug.apk
          cat > "$RUNNER_TEMP/apk-notes.md" <<'NOTES'
          Download **hejje-debug.apk** below and open it on your Android phone.

          This is a development build, published without waiting for unit tests or lint.
          It installs alongside the signed release app. Each build uses a temporary debug
          signing key; installing a later debug build may require uninstalling the previous
          debug app first. Export any trips before uninstalling.

          For regular updates that preserve your trips, use the signed Release workflow.
          NOTES
          gh release create "$TAG" hejje-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hejje debug build ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/apk-notes.md" \
            --prerelease
          printf 'Download APK: https://github.com/%s/releases/download/%s/hejje-debug.apk\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
