<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, F = 1300;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const lc = layer.getContext('2d');
const ORANGE = [255, 122, 26], PINK = [255, 61, 127], ACCENT = '#E8590C', INK = '#F5F2EF';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeSine = t => -(Math.cos(Math.PI * clamp(t)) - 1) / 2;
const win = (t, a, b, fi = .5, fo = .5) => clamp((t - a) / fi) * clamp((b - t) / fo);
const mix = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- world ----------
let paths, baselineY, feetX, feetH, feetW, wordH;
function init(G) {
  const S = 1000 / G.w, em = G.upem * S;
  feetH = .6 * em; feetW = feetH * 38 / 36; const gap = .06 * em, total = 1000 + gap + feetW;
  const ox = -total / 2; wordH = G.h * S; const oy = -wordH / 2 - 40;
  baselineY = G.baseline * S + oy; feetX = ox + 1000 + gap;
  paths = G.contours.map(c => {
    const pts = c.pts.map(p => [p[0] * S + ox, p[1] * S + oy]);
    const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, L: cum[cum.length - 1] };
  });
  // Start the hero drive where its road is gentlest: a point on the longest outline.
  const h = paths[0]; let best = 0, bestScore = 1e9;
  for (let i = 0; i < h.pts.length; i += 3) {
    let turn = 0; const s0 = h.cum[i];
    for (let d = 0; d < 700; d += 25) turn += Math.abs(angDiff(dirAt(h, s0 + d + 25), dirAt(h, s0 + d)));
    if (turn < bestScore) { bestScore = turn; best = i; }
  }
  rotatePath(h, best);
  buildGrid(); buildStars(); buildGrain();
}
function rotatePath(p, i) {
  const pts = p.pts.slice(i, -1).concat(p.pts.slice(0, i + 1));
  const cum = [0]; for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  p.pts = pts; p.cum = cum; p.L = cum[cum.length - 1];
}
function idx(p, s) { s = ((s % p.L) + p.L) % p.L; let lo = 0, hi = p.cum.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p.cum[m] <= s) lo = m; else hi = m; } return [lo, s]; }
function at(p, s) { const [i, ss] = idx(p, s); const a = p.pts[i], b = p.pts[i + 1], seg = p.cum[i + 1] - p.cum[i] || 1, t = (ss - p.cum[i]) / seg; return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
function dirAt(p, s) { const a = at(p, s - 6), b = at(p, s + 6); return Math.atan2(b[1] - a[1], b[0] - a[0]); }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function heading(p, s) { let x = 0, y = 0; for (let d = -60; d <= 160; d += 20) { const a = dirAt(p, s + d); x += Math.cos(a); y += Math.sin(a); } return Math.atan2(y, x); }

// ---------- timeline ----------
const T_DRIVE = 1.6, T_STOP = 3.7, T_GO = 4.25, T_PULL = 5.4, T_DONE = 10.0, S_STOP = 520, S_PULL = 820;
function heroS(t) {
  if (t < T_DRIVE) return 0;
  if (t < T_STOP) return S_STOP * easeSine((t - T_DRIVE) / (T_STOP - T_DRIVE));
  if (t < T_GO) return S_STOP;
  if (t < T_PULL) { const u = (t - T_GO) / (T_PULL - T_GO); return S_STOP + (S_PULL - S_STOP) * u * u; }
  const u = (t - T_PULL) / (T_DONE - T_PULL);
  return Math.min(paths[0].L, S_PULL + (paths[0].L - S_PULL) * clamp(u + .2 * u * (1 - u)));
}
function pathS(i, t) {
  if (i === 0) return heroS(t);
  const t0 = 5.9 + (i - 1) * .34; return paths[i].L * ease((t - t0) / (T_DONE - t0));
}
function camAt(t) {
  const p = paths[0], s = heroS(Math.max(t, 0));
  const look = at(p, s + 45);
  const follow = { tx: look[0], ty: look[1], phi: heading(p, s), th: 1.1, D: lerp(340, 290, easeOut(t / 2)), cy: 1060 };
  const fin = { tx: 0, ty: 0, phi: -Math.PI / 2, th: 0, D: F / (900 / (1000 + feetW + 38)), cy: 800 };
  const e = ease((t - T_PULL) / (T_DONE + .2 - T_PULL));
  if (e <= 0) return follow;
  return {
    tx: lerp(follow.tx, fin.tx, e), ty: lerp(follow.ty, fin.ty, e),
    phi: follow.phi + angDiff(fin.phi, follow.phi) * e, th: lerp(follow.th, fin.th, e),
    D: follow.D * Math.pow(fin.D / follow.D, e), cy: lerp(follow.cy, fin.cy, e),
  };
}
let C;
function proj(x, y) {
  const dx = x - C.tx, dy = y - C.ty, a = -Math.PI / 2 - C.phi, ca = Math.cos(a), sa = Math.sin(a);
  const u = dx * ca - dy * sa, v = dx * sa + dy * ca;
  const Z = C.D - v * Math.sin(C.th);
  if (Z < 25) return null;
  return [W / 2 + F * u / Z, C.cy + F * v * Math.cos(C.th) / Z, F / Z, Z];
}

// ---------- scenery ----------
let grid = [], stars = [], grain;
function buildGrid() {
  const R = 1700, step = 85, rot = .26;
  const lines = [];
  for (let k = -R; k <= R; k += step) {
    const j = (rnd() - .5) * 26, major = Math.round(k / step) % 4 === 0;
    lines.push({ a: [-R, k + j], b: [R, k + j], major }); lines.push({ a: [k + j, -R], b: [k + j, R], major });
  }
  for (const l of lines) {
    const segs = [], n = Math.ceil(2 * R / 60);
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = lerp(l.a[0], l.b[0], t), y = lerp(l.a[1], l.b[1], t) + Math.sin(t * 9 + l.a[1]) * 6;
      segs.push([x * Math.cos(rot) - y * Math.sin(rot), x * Math.sin(rot) + y * Math.cos(rot)]);
    }
    grid.push({ segs, major: l.major });
  }
}
function buildStars() { for (let i = 0; i < 260; i++) stars.push([rnd() * W, rnd() * H, rnd() * 1.6 + .3, rnd() * 6.28, rnd()]); }
function buildGrain() {
  grain = document.createElement('canvas'); grain.width = 540; grain.height = 960; const g = grain.getContext('2d'), d = g.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
}

// ---------- footprints (the app's mark) ----------
const SOLE = new Path2D('M47,78 C40.5,78 37,71.5 38.2,64 C39.2,57.5 42,53.5 42,47 C42,39 46.5,34 53.5,34 C61.5,34 66,40 65,48 C64.2,54.5 61,58.5 59.8,65 C58.5,72.5 54,78 47,78 Z');
const TOES = [[44, 27.5, 4.6], [52.8, 23.6, 3.5], [60, 24.2, 3], [66.2, 27, 2.6], [70.6, 31.6, 2.2]];
const FEET = [{ sx: -.5, rot: 4, tx: -44.5, ty: -28.5 }, { sx: .5, rot: -4, tx: -26, ty: -33 }];
function foot(g, f) {
  g.save(); g.translate(f.tx + 54.5, f.ty + 49.5); g.rotate(f.rot * Math.PI / 180); g.scale(f.sx, .5); g.translate(-54.5, -49.5);
  g.fill(SOLE); for (const [x, y, r] of TOES) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  g.restore();
}
// Feet [h] tall with the bottom-left at (x, y). [steps] 0..1 per foot for a step-in animation.
function feet(g, x, y, h, color, alpha, steps = [1, 1]) {
  for (let i = 0; i < 2; i++) {
    const s = steps[i]; if (s <= 0) continue;
    g.save(); g.globalAlpha = alpha * clamp(s * 1.4); g.fillStyle = color;
    g.translate(x, y - h + (1 - easeOut(s)) * h * .35); g.scale(h / 36, h / 36);
    foot(g, FEET[i]); g.restore();
  }
}

// ---------- drawing ----------
function background(t) {
  const g = ctx.createRadialGradient(W / 2, H * .42, 50, W / 2, H * .5, H * .75);
  g.addColorStop(0, '#15161b'); g.addColorStop(.55, '#0b0c10'); g.addColorStop(1, '#040405');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const space = clamp((t - 6.5) / 3) * .9 + .12;
  for (const [x, y, r, ph, b] of stars) {
    const tw = .55 + .45 * Math.sin(t * (1.5 + b * 2) + ph);
    ctx.fillStyle = `rgba(255,236,220,${space * tw * (.25 + b * .6)})`; ctx.beginPath(); ctx.arc(x, y + (t * 6 * b) % 4, r, 0, 7); ctx.fill();
  }
}
function drawGrid(t) {
  const fade = lerp(1, .32, ease((t - T_PULL) / 4.5));
  ctx.lineCap = 'round';
  for (const l of grid) {
    for (let i = 0; i < l.segs.length - 1; i++) {
      const a = proj(...l.segs[i]), b = proj(...l.segs[i + 1]); if (!a || !b) continue;
      const fog = clamp(1 - (a[3] - C.D) / (C.D * 2.6 + 400));
      if (fog <= 0.01) continue;
      ctx.strokeStyle = `rgba(${l.major ? '70,76,88' : '48,52,60'},${fog * fade * (l.major ? .9 : .6)})`;
      ctx.lineWidth = Math.max(.6, (l.major ? 3.2 : 1.7) * a[2]);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
  }
}
function drawTrails(t, g) {
  g.clearRect(0, 0, W, H); g.lineCap = 'round'; g.lineJoin = 'round';
  const heads = [];
  paths.forEach((p, i) => {
    const s = pathS(i, t); if (s <= 0) return;
    let prev = proj(...p.pts[0]); const [last] = idx(p, Math.min(s, p.L - .01));
    const pts = p.pts.slice(0, last + 1).concat([at(p, Math.min(s, p.L - .01))]);
    for (let k = 1; k < pts.length; k++) {
      const q = proj(...pts[k]); if (!q || !prev) { prev = q; continue; }
      const frac = (k / pts.length) * (s / p.L), near = clamp(1 - (s - (p.cum[Math.min(k, p.cum.length - 1)] || s)) / 120);
      const c = mix(mix(ORANGE, PINK, frac), [255, 220, 180], near * .6);
      g.strokeStyle = rgba(c, 1); g.lineWidth = clamp(6.5 * q[2], 2.4, 17);
      g.beginPath(); g.moveTo(prev[0], prev[1]); g.lineTo(q[0], q[1]); g.stroke(); prev = q;
    }
    if (s < p.L - 1) heads.push([at(p, s), i]);
  });
  for (const [[x, y]] of heads) {
    const q = proj(x, y); if (!q) continue; const r = clamp(7 * q[2], 4, 13);
    const rg = g.createRadialGradient(q[0], q[1], 0, q[0], q[1], r * 2.6);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(.25, 'rgba(255,214,170,.9)'); rg.addColorStop(1, 'rgba(255,122,26,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(q[0], q[1], r * 2.6, 0, 7); g.fill();
  }
}
// A warm pool of light on the road around each moving car.
function carLight(t) {
  if (t > T_PULL + 2) return;
  const p = paths[0], s = heroS(t), q = proj(...at(p, s)); if (!q || t < T_DRIVE - .2) return;
  const r = 150 * q[2], a = .22 * win(t, T_DRIVE - .2, T_PULL + 2, .4, 1.2);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(q[0], q[1]); ctx.scale(1, Math.cos(C.th) * .9 + .1);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, `rgba(255,150,70,${a})`); g.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.restore();
}
function composite(t) {
  const flash = Math.exp(-Math.pow((t - 10.15) / .35, 2));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(30px)'; ctx.globalAlpha = .62 + flash * .6; ctx.drawImage(layer, 0, 0);
  ctx.filter = 'blur(9px)'; ctx.globalAlpha = .55; ctx.drawImage(layer, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none'; ctx.globalAlpha = lerp(1, .55, clamp((t - 10.6) / 1)); ctx.drawImage(layer, 0, 0);
  ctx.restore();
}
function wordFill(t) {
  const a = ease((t - 10.4) / 1.1); if (a <= 0) return;
  const path = new Path2D();
  for (const p of paths) { p.pts.forEach((pt, k) => { const q = proj(...pt); if (q) k ? path.lineTo(q[0], q[1]) : path.moveTo(q[0], q[1]); }); path.closePath(); }
  ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = 'rgba(255,120,60,.55)'; ctx.shadowBlur = 40;
  ctx.fillStyle = INK; ctx.fill(path, 'evenodd'); ctx.restore();
}
function stopPin(t, p, s, t0, h, label) {
  const k = clamp((t - t0) / .45); if (k <= 0) return;
  const [x, y] = at(p, s), q = proj(x, y); if (!q) return;
  const pop = k < 1 ? 1 + Math.sin(k * Math.PI) * .25 : 1, size = h * q[2] * pop * easeOut(k);
  const fadeOut = 1 - clamp((t - 10.3) / .6);
  ctx.save(); ctx.shadowColor = 'rgba(232,89,12,.9)'; ctx.shadowBlur = 30;
  feet(ctx, q[0] - size * 38 / 36 / 2, q[1] - size * .25, size, '#FF8A3D', fadeOut);
  ctx.restore();
  if (label) {
    const la = win(t, t0 + .15, 5.6, .35, .5); if (la <= 0) return;
    ctx.save(); ctx.globalAlpha = la; ctx.font = '600 38px "Inter"'; ctx.letterSpacing = '3px';
    const w = ctx.measureText(label).width + 60, bx = q[0] - w / 2, by = q[1] - size - 110;
    ctx.fillStyle = 'rgba(20,21,26,.82)'; ctx.strokeStyle = 'rgba(255,138,61,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, by, w, 78, 39); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, q[0], by + 41);
    ctx.restore();
  }
}
function hud(t) {
  const a = win(t, T_DRIVE + .2, T_PULL + .6, .5, .6); if (a <= 0) return;
  const s1 = heroS(t), s0 = heroS(t - 1 / 15), kmh = Math.round(clamp((s1 - s0) * 15 / 5.2, 0, 99) + (s1 > s0 ? Math.sin(t * 7) * 2 : 0));
  const km = s1 / 66;
  ctx.save(); ctx.globalAlpha = a; const y = 1560 + (1 - a) * 30;
  ctx.fillStyle = 'rgba(14,15,19,.78)'; ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(90, y, 900, 230, 46); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,138,61,1)'; ctx.font = '600 24px "Inter"'; ctx.letterSpacing = '5px'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('▶  REPLAY', 140, y + 62);
  ctx.fillStyle = INK; ctx.letterSpacing = '0px'; ctx.font = '300 120px "Inter Display"'; ctx.fillText(String(Math.max(0, kmh)), 136, y + 190);
  const numW = ctx.measureText(String(Math.max(0, kmh))).width;
  ctx.fillStyle = 'rgba(245,242,239,.55)'; ctx.font = '500 26px "Inter"'; ctx.letterSpacing = '4px'; ctx.fillText('KM/H', 136 + numW + 18, y + 186);
  // Odometer drums
  const digits = km.toFixed(1).padStart(5, '0').replace('.', ''), dw = 74, dx = 990 - 50 - dw * 4 - 26;
  ctx.font = '500 24px "Inter"'; ctx.fillStyle = 'rgba(245,242,239,.55)'; ctx.fillText('TRIP  KM', dx, y + 62);
  for (let i = 0; i < 4; i++) {
    const x = dx + i * dw + (i === 3 ? 26 : 0);
    ctx.fillStyle = i === 3 ? '#E8590C' : '#23252c'; ctx.beginPath(); ctx.roundRect(x, y + 88, dw - 10, 104, 14); ctx.fill();
    ctx.fillStyle = INK; ctx.font = '500 64px "Inter Display"'; ctx.letterSpacing = '0px'; ctx.textAlign = 'center'; ctx.fillText(digits[i], x + (dw - 10) / 2, y + 164);
    ctx.textAlign = 'left';
  }
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(dx + dw * 3 + 8, y + 182, 5, 0, 7); ctx.fill();
  ctx.restore();
}
function words(t, text, y, size, weight, t0, t1, color = INK, spacing = 2, family = 'Inter Display') {
  const a = win(t, t0, t1, .6, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.filter = `blur(${(1 - clamp((t - t0) / .6)) * 14}px)`;
  ctx.font = `${weight} ${size}px "${family}"`; ctx.letterSpacing = `${spacing}px`; ctx.fillStyle = color; ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 24;
  ctx.fillText(text, W / 2, y - (1 - easeOut((t - t0) / .8)) * 24); ctx.restore();
}
function intro(t) {
  const a = win(t, 0, 1.75, .5, .45); if (a <= 0) return;
  const start = proj(...at(paths[0], 0)), k = easeSine((t - .9) / .8);
  const h = lerp(250, 40, k), cx = lerp(W / 2, start ? start[0] : W / 2, k), cy = lerp(H * .45 + h / 2, start ? start[1] : H * .6, k);
  ctx.save(); ctx.shadowColor = 'rgba(232,89,12,.95)'; ctx.shadowBlur = 60;
  feet(ctx, cx - h * 38 / 36 / 2, cy, h, '#FF7A2E', a, [clamp(t / .5), clamp((t - .25) / .5)]); ctx.restore();
}
function lockup(t) {
  if (t < 10.6) return;
  const q = proj(feetX, baselineY); if (!q) return;
  const h = feetH * q[2];
  ctx.save(); ctx.shadowColor = 'rgba(232,89,12,.9)'; ctx.shadowBlur = 50;
  feet(ctx, q[0], q[1], h, ACCENT, 1, [clamp((t - 10.75) / .45), clamp((t - 11.05) / .45)]); ctx.restore();
  words(t, 'Hejje Guruthu', 1255, 70, 600, 11.7, 99, INK, 1);
  words(t, 'Every drive, recorded on its own.', 1335, 42, 300, 12.2, 99, 'rgba(245,242,239,.72)', 1, 'Inter Display');
  words(t, 'COMING SOON ON GOOGLE PLAY', 1760, 26, 500, 12.9, 99, 'rgba(255,138,61,.9)', 7, 'Inter');
}
function finish(t) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .05; ctx.globalCompositeOperation = 'overlay';
  const ox = Math.floor(rnd() * 300), oy = Math.floor(rnd() * 500); ctx.drawImage(grain, -ox, -oy, 540 * 2.6, 960 * 2.6); ctx.restore();
  const fadeIn = clamp(t / .35); if (fadeIn < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fadeIn})`; ctx.fillRect(0, 0, W, H); }
}
function render(t) {
  C = camAt(t);
  background(t); drawGrid(t); carLight(t); drawTrails(t, lc); composite(t); wordFill(t);
  stopPin(t, paths[0], S_STOP, T_STOP - .05, 46, 'COFFEE · 12 MIN');
  stopPin(t, paths[1], paths[1].L * .45, 7.6, 46); stopPin(t, paths[2], paths[2].L * .6, 8.3, 46);
  intro(t); hud(t);
  words(t, 'Every drive', 300, 84, 300, T_DRIVE + .3, T_PULL, INK, 3);
  words(t, 'leaves a footprint.', 300, 84, 300, T_PULL + .4, 9.9, INK, 3);
  lockup(t); finish(t);
}
window.init = init; window.render = render;
</script></body></html>
